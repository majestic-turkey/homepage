# nginx alternative to the Caddyfile. Assumes certificates already exist
# (e.g. from certbot); nginx does not obtain them for you.

server {
    listen 80;
    listen [::]:80;
    server_name thesaltworks.io www.thesaltworks.io;
    return 301 https://www.thesaltworks.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thesaltworks.io;

    ssl_certificate     /etc/letsencrypt/live/thesaltworks.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesaltworks.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
