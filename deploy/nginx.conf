# Homepage server block for www.thesaltworks.io.
#
# Two ways to apply this, depending on whether you already hold a certificate
# covering the apex and www:
#
#   sudo certbot certificates          # check what you have
#
# (a) No cert yet — paste ONLY the port 80 server blocks below into
#     /etc/nginx/sites-available/thesaltworks, symlink it into sites-enabled,
#     then run:
#
#       sudo certbot --nginx -d thesaltworks.io -d www.thesaltworks.io
#
#     Certbot rewrites the file in place, adding the TLS block and the
#     redirect. You can then delete the 443 block below — it is only here as a
#     reference for what certbot produces.
#
# (b) Cert already exists — use the whole file as-is, after checking that the
#     ssl_certificate paths match `certbot certificates` output.
#
# Either way: nginx -t before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name thesaltworks.io www.thesaltworks.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- reference: what certbot --nginx produces -------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thesaltworks.io www.thesaltworks.io;

    ssl_certificate     /etc/letsencrypt/live/thesaltworks.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesaltworks.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # The homepage container publishes on loopback only, so this is
        # reachable from the host but not from outside the VPS.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
