services:
  # Read-only gatekeeper in front of /var/run/docker.sock. The homepage never
  # touches the socket itself, and this proxy permits exactly one API surface:
  # GET /containers/json. Everything else — exec, images, volumes, the ability
  # to start a privileged container — is refused.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      # Explicit denials; the image defaults these off, but being loud about it
      # means a future image default can't quietly widen the blast radius.
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-internal
    # No ports: — the proxy is reachable only from this internal network.

  homepage:
    build: .
    image: thesaltworks/homepage:latest
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SITE_TITLE: The Salt Works
      SITE_TAGLINE: Services running on this box
      # PUBLIC_HOST: thesaltworks.io   # optional: derive links from published ports
    networks:
      # Two networks, and both are load-bearing. homepage-internal is how this
      # container reaches the socket proxy. homepage-edge exists solely so the
      # published port below can be established: Docker cannot publish a port
      # for a container attached only to an `internal: true` network, and it
      # fails silently when you try — the binding shows up in the container's
      # HostConfig but never takes effect, and `docker ps` reports a bare
      # `8080/tcp`.
      - homepage-internal
      - homepage-edge
    # Bound to loopback: the host's nginx reaches it at 127.0.0.1:8080, and
    # nothing outside the VPS can hit the container directly. If you later move
    # your proxy into Docker, drop this and put both on a shared network
    # instead so the port never leaves the daemon.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      homepage.enable: "true"
      homepage.title: "Homepage"
      homepage.url: "https://www.thesaltworks.io"
      homepage.description: "This dashboard"
      homepage.icon: "🧭"
      homepage.group: "Infrastructure"
      homepage.order: "99"

networks:
  # No route off the host and no published ports: the socket proxy is reachable
  # only from the homepage container.
  homepage-internal:
    internal: true

  # An ordinary bridge carrying the homepage container alone. Only here so the
  # loopback publish above works; the socket proxy is deliberately not on it.
  homepage-edge: {}
